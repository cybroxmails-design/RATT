name: Build RATT iOS IPA

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'ratt/ios/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
    - uses: actions/checkout@v4

    - name: Generate Xcode Project if missing
      run: |
        cd ratt/ios
        python3 create_xcode_project.py

    - name: Build and Archive iOS App & Keyboard Extension
      run: |
        xcodebuild archive \
          -project ratt/ios/Ratt.xcodeproj \
          -scheme RattApp \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath build/Ratt.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          DEVELOPMENT_TEAM=""

    - name: Package into IPA
      run: |
        mkdir -p build/ipa/Payload
        cp -r build/Ratt.xcarchive/Products/Applications/RattApp.app build/ipa/Payload/
        cd build/ipa
        zip -qr Ratt-v2.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ratt-v2-iOS.ipa
        path: build/ipa/Ratt-v2.ipa
